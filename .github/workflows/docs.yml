name: Documentation
# Builds the documentation website (Astro + Starlight) on pull requests, and publishes
# it to GitHub Pages on pushes to the branch below.
# Switch the branch to `main` once dev is released.
on:
  push:
    branches:
      - dev
  pull_request:
    paths:
      - "docs/**"
      - "nextflow_schema.json"
      - "CHANGELOG.md"
      - "CITATIONS.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Astro
        run: npm ci

      # Fails the build on broken links and anchors (starlight-links-validator)
      - name: Build the documentation
        run: npm run build

      - name: Upload the website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
