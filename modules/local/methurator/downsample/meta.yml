name: methurator downsample
description: Performs downsampling and sequencing saturation analysis of bisulfite sequencing reads using methurator.
keywords:
  - rrbs
  - BS-seq
  - methylation
  - 5mC
  - methylseq
  - bisulphite
  - bisulfite
  - bam
tools:
  - methurator:
      description: |
        methurator is a Python package designed to estimate sequencing saturation 
        for reduced-representation bisulfite sequencing (RRBS) data.
      homepage: https://github.com/VIBTOBIlab/methurator
      documentation: https://github.com/VIBTOBIlab/methurator/README.md
      doi: ""
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: |
        Raw BAM file to perform downsampling and saturation analysis on.
  - fasta:
      type: file
      description: |
        Reference genome in FASTA format.
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - summary_report:
      type: file
      description: |
        YAML file summarizing the downsampling and saturation analysis results.
authors:
  - "@edogiuili"
