name: methurator gt-estimator
description: Methurator is a Python package designed to estimate CpGs saturation for DNA methylation sequencing data.
keywords:
  - rrbs
  - BS-seq
  - methylation
  - 5mC
  - methylseq
  - bisulphite
  - bam
tools:
  - methurator:
      description: |
        Methurator is a Python package designed to estimate CpGs saturation 
        for DNA methylation sequencing data.
      homepage: https://github.com/VIBTOBIlab/methurator
      documentation: https://github.com/VIBTOBIlab/methurator/README.md
      doi: ""
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: |
        Raw BAM file to perform downsampling and saturation analysis on.
  - fasta:
      type: file
      description: |
        Reference genome in FASTA format.
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - summary_report:
      type: file
      description: |
        YAML file summarizing the saturation analysis results.
authors:
  - "@edogiuili"
