name: methurator plot
description: Plots results obtained using methurator downsample command.
keywords:
  - rrbs
  - BS-seq
  - methylation
  - 5mC
  - methylseq
  - bisulphite
  - bisulfite
  - bam
tools:
  - methurator:
      description: |
        methurator is a Python package designed to estimate sequencing saturation 
        for reduced-representation bisulfite sequencing (RRBS) data.
      homepage: https://github.com/VIBTOBIlab/methurator
      documentation: https://github.com/VIBTOBIlab/methurator/README.md
      doi: ""
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - summary_report:
      type: file
      description: |
        YAML file summarizing the downsampling and saturation analysis results.
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - plots:
      type: folder
      description: |
        Folder storing the generated plots from the saturation analysis.
authors:
  - "@edogiuili"
