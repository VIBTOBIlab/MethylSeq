repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-methylseq_logo_light.png
    - docs/images/nf-core-methylseq_logo_light.png
    - docs/images/nf-core-methylseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-methylseq_logo_light.png
    - docs/images/nf-core-methylseq_logo_light.png
    - docs/images/nf-core-methylseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: VIBTOBIlab
  name: MethylSeq
  description: Methylation (Bisulfite-Sequencing) analysis pipeline using Bismark
    or bwa-meth + MethylDackel.
  author: Phil Ewels, Edoardo Giuili
  version: 2.6.5
  force: false
  outdir: .
  skip_features:
    - gpu
    - rocrate
  is_nfcore: false
